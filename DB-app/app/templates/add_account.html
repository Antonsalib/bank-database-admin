<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add account · Bank Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='add_style.css') }}">
</head>
<body>
    <div class="container account">
        {% with messages = get_flashed_messages(with_categories=True) %}{% if messages %}<div class="flash-messages">{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
        <h1>Add a new account</h1>
        <form action="{{ url_for('account.add_account') }}" method="POST" class="form">
            <div class="form-group"><label for="customer_ids">Account owners</label><select id="customer_ids" name="customer_ids" multiple required size="5">{% for customer in customers %}<option value="{{ customer.customer_id }}">{{ customer.full_name }} · #{{ customer.customer_id }}</option>{% endfor %}</select><small>Select one or more customers. The first selected customer is the primary owner.</small></div>
            <div class="form-group"><label for="branch_id">Branch</label><select id="branch_id" name="branch_id" required><option value="" disabled selected>Choose a branch…</option>{% for branch in branches %}<option value="{{ branch.branch_id }}">{{ branch.branch_name }}</option>{% endfor %}</select></div>
            <div class="form-group"><label for="balance">Opening balance</label><input type="number" id="balance" name="balance" min="0" placeholder="0.00" step="0.01" required></div>
            <div class="form-group"><label for="account_status">Account status</label><select id="account_status" name="account_status" required><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
            <div class="form-group"><label for="account_type">Account type</label><select id="account_type" name="account_type" required><option value="" disabled selected>Choose an account type…</option><option value="Checking">Checking</option><option value="Savings">Savings</option><option value="Credit Card">Credit Card</option></select></div>
            <div class="button-action"><a href="{{ url_for('account.Accounts') }}" class="btn-cancel">Cancel</a><button type="submit" class="btn-submit">Create account</button></div>
        </form>
    </div>
</body>
</html>
