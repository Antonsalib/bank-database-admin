<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New transfer · Bank Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='add_style.css') }}">
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=True) %}{% if messages %}<div class="flash-messages">{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
        <h1>Create an account transfer</h1>
        <p class="form-note">A transfer creates linked debit and credit ledger entries together.</p>
        <form method="POST" class="form">
            <div class="form-group"><label for="from_account_id">From account</label><select id="from_account_id" name="from_account_id" required><option value="" disabled selected>Choose a sending account…</option>{% for account in accounts %}<option value="{{ account.account_id }}">#{{ account.account_id }} · {{ account.account_type }} · ${{ '{:,.2f}'.format(account.balance) }}</option>{% endfor %}</select></div>
            <div class="form-group"><label for="to_account_id">To account</label><select id="to_account_id" name="to_account_id" required><option value="" disabled selected>Choose a receiving account…</option>{% for account in accounts %}<option value="{{ account.account_id }}">#{{ account.account_id }} · {{ account.account_type }}</option>{% endfor %}</select></div>
            <div class="form-group"><label for="amount">Amount</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" required></div>
            <div class="form-group"><label for="transaction_date">Transfer date</label><input id="transaction_date" name="transaction_date" type="date" required></div>
            <div class="button-action"><a href="{{ url_for('transaction.transactions') }}" class="btn-cancel">Cancel</a><button type="submit" class="btn-submit">Create transfer</button></div>
        </form>
    </div>
</body>
</html>
